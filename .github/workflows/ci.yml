name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # The snapshot commit does not move on its own; PRs and pushes to main run the
    # check. The weekly run covers main between those events.
    - cron: "0 3 * * 1"

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Pytest
        run: pytest

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Fetch SGLang
        run: bash scripts/fetch_sglang.sh
      - name: Slow tests
        env:
          SGLANG_SRC: /tmp/sglang-src
        run: pytest -m slow
