name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly check that sync-knowledge still reproduces the bundled snapshot.
    - cron: "0 3 * * 1"

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pytest
        run: pytest

  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Fetch SGLang
        run: bash scripts/fetch_sglang.sh
      - name: Snapshot reproducibility
        env:
          SGLANG_SRC: /tmp/sglang-src
        run: pytest -m slow
