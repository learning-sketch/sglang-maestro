name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # The snapshot commit does not move on its own; PRs and pushes to main run the
    # check. The weekly run covers main between those events.
    - cron: "0 3 * * 1"

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Pytest
        run: pytest

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        hardware: [h20, h100-sxm, template-h20-class]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Fetch SGLang
        if: matrix.hardware == 'h20'
        run: bash scripts/fetch_sglang.sh
      - name: Slow tests
        env:
          # Snapshot reproducibility runs on one shard. The other shards leave
          # SGLANG_SRC empty so that test skips; locally it still runs when the
          # variable is set and SGLANG_MAESTRO_SLOW_HARDWARE is unset.
          SGLANG_SRC: ${{ matrix.hardware == 'h20' && '/tmp/sglang-src' || '' }}
          SGLANG_MAESTRO_SLOW_HARDWARE: ${{ matrix.hardware }}
        run: pytest -m slow
