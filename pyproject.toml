[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-maestro"
version = "0.1.0"
description = "An agent that adapts, profiles, tunes and deploys LLMs on SGLang for H20-class accelerators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sglang-maestro = "sglang_maestro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sglang_maestro = [
    "knowledge/*.json",
    "data/hardware/*.yaml",
    "data/models/*.json",
    "data/models/*.yaml",
    "data/workloads/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not slow\""
markers = [
    "slow: regenerates the SGLang capability snapshot; set SGLANG_SRC to the checkout",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]
